<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caseirinho Temperos & Sabores — Faça seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EEE0;
    --cream-2:#EFE4CF;
    --brown:#3B2A1E;
    --brown-soft:#6B5645;
    --terracotta:#C1622B;
    --terracotta-dark:#A34D1E;
    --olive:#6B7B4F;
    --gold:#C9A227;
    --white:#FFFDF8;
    --shadow: 0 8px 24px rgba(59,42,30,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background: var(--cream) url('assets/fundo.jpg') center top / cover no-repeat fixed;
    color: var(--brown);
    min-height:100vh;
    padding-bottom: 80px;
  }
  /* véu translúcido sobre o fundo pra garantir leitura do conteúdo */
  body::before{
    content:"";
    position: fixed;
    inset:0;
    background: rgba(245,238,224,0.86);
    z-index:-1;
  }
  header{
    text-align:center;
    padding: 28px 20px 10px;
  }
  .logo-img{
    width: 190px;
    max-width: 60vw;
    height:auto;
    filter: drop-shadow(0 4px 10px rgba(59,42,30,0.15));
  }

  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .line-section{
    margin-top: 34px;
  }
  .line-title{
    font-family:'Caveat', cursive;
    font-size: 34px;
    color: var(--terracotta-dark);
    margin-bottom: 2px;
  }
  .line-desc{
    font-size: 13px;
    color: var(--brown-soft);
    margin-bottom: 14px;
    font-style: italic;
  }

  .product-card{
    background: var(--white);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(59,42,30,0.06);
  }
  .product-name{
    font-weight:600;
    font-size: 16px;
    margin:0 0 2px;
  }
  .product-desc{
    font-size: 12.5px;
    color: var(--brown-soft);
    margin: 0 0 12px;
  }
  .size-options{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
  }
  .size-btn{
    border: 1.5px solid var(--terracotta);
    background: transparent;
    color: var(--terracotta-dark);
    border-radius: 10px;
    padding: 8px 12px;
    font-family:'Poppins',sans-serif;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    transition: all .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width: 78px;
  }
  .size-btn small{ font-weight:500; opacity:0.85; margin-top:2px;}
  .size-btn:hover{ background: rgba(193,98,43,0.08); }
  .size-btn:active{ transform: scale(0.97); }

  /* Cart */
  .cart-fab{
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--terracotta);
    color: white;
    border:none;
    border-radius: 999px;
    padding: 14px 22px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14px;
    box-shadow: 0 6px 18px rgba(193,98,43,0.4);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    z-index: 50;
  }
  .cart-badge{
    background: white;
    color: var(--terracotta-dark);
    border-radius:999px;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    font-weight:700;
  }

  .overlay{
    position: fixed; inset:0;
    background: rgba(59,42,30,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 100;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background: var(--cream);
    width: 100%;
    max-width: 760px;
    max-height: 88vh;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px 30px;
    overflow-y:auto;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.25);
  }
  .sheet-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 14px;
  }
  .sheet-title{ font-family:'Caveat',cursive; font-size:30px; color:var(--terracotta-dark); margin:0;}
  .close-btn{
    background:none; border:none; font-size:22px; color:var(--brown-soft); cursor:pointer;
  }
  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: var(--white);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .cart-item-info b{ font-size:14px; }
  .cart-item-info div{ font-size:12px; color:var(--brown-soft); }
  .remove-btn{
    background: none;
    border: 1px solid #d88;
    color: #b33;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor:pointer;
  }
  .empty-cart{
    text-align:center;
    color: var(--brown-soft);
    font-size: 14px;
    padding: 30px 0;
  }

  .totals{
    margin-top: 16px;
    background: var(--white);
    border-radius: 14px;
    padding: 16px;
  }
  .totals-row{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; color:var(--brown-soft);}
  .totals-row.total{ font-size:18px; font-weight:700; color:var(--brown); border-top:1px dashed rgba(59,42,30,0.2); padding-top:10px; margin-top: 8px;}
  .shipping-note{ font-size:12px; color: var(--olive); margin-top:4px; }

  .checkout-btn{
    width:100%;
    background: var(--olive);
    color: white;
    border:none;
    border-radius: 12px;
    padding: 14px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:15px;
    margin-top: 16px;
    cursor:pointer;
  }
  .checkout-btn:disabled{ background: #b8b8a8; cursor:not-allowed;}

  input[type=text]{
    width:100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(59,42,30,0.2);
    font-family:'Poppins',sans-serif;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 12px;
  }
  label.field-label{ font-size:13px; font-weight:600; color:var(--brown-soft); }

  .pix-box{
    background: var(--brown);
    color: var(--cream);
    border-radius: 14px;
    padding: 18px;
    text-align:center;
    margin-top: 16px;
  }
  .pix-key{
    font-size: 20px;
    font-weight:700;
    letter-spacing: 1px;
    margin: 8px 0;
    word-break: break-all;
  }
  .copy-btn{
    background: var(--gold);
    color: var(--brown);
    border:none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight:700;
    cursor:pointer;
    font-size: 13px;
  }
  .success-icon{ font-size: 44px; text-align:center; margin-bottom: 8px;}

  footer{
    text-align:center;
    font-size: 12px;
    color: var(--brown-soft);
    padding: 30px 20px 10px;
  }
</style>
</head>
<body>

<header>
  <img class="logo-img" src="assets/logo.png" alt="Caseirinho Temperos & Sabores">
</header>

<main id="menu"></main>

<button class="cart-fab" id="cartFab" onclick="openCart()">
  🛒 Meu pedido <span class="cart-badge" id="cartBadge">0</span>
</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<footer>
  Frete grátis para pedidos acima de R$ 100 · Abaixo disso, taxa de R$ 15
  <br>Caseirinho Temperos &amp; Sabores © 2026
</footer>

<script src="data.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let cart = []; // {id, lineKey, prodKey, prodLabel, sizeKey, sizeLabel, price}
let cartIdCounter = 0;
let sheetMode = "cart"; // cart | checkout | success

/* ---------- render menu ---------- */
function renderMenu(){
  const el = document.getElementById("menu");
  el.innerHTML = "";
  Object.entries(MENU).forEach(([lineKey, line]) => {
    const section = document.createElement("div");
    section.className = "line-section";
    section.innerHTML = `<div class="line-title">${line.label}</div><div class="line-desc">${line.desc}</div>`;
    line.products.forEach(prod => {
      const card = document.createElement("div");
      card.className = "product-card";
      const sizesHtml = line.sizes.map(sz => `
        <button class="size-btn" onclick="addToCart('${lineKey}','${prod.key}','${prod.label.replace(/'/g,"\\'")}','${sz.key}','${sz.label}',${sz.price})">
          ${sz.label}<small>R$ ${sz.price.toFixed(2)}</small>
        </button>
      `).join("");
      card.innerHTML = `
        <p class="product-name">${prod.label}</p>
        <p class="product-desc">${prod.desc}</p>
        <div class="size-options">${sizesHtml}</div>
      `;
      section.appendChild(card);
    });
    el.appendChild(section);
  });
}

function addToCart(lineKey, prodKey, prodLabel, sizeKey, sizeLabel, price){
  cart.push({
    id: cartIdCounter++,
    lineKey, prodKey, prodLabel, sizeKey, sizeLabel, price
  });
  updateBadge();
  // pequena confirmação visual
  const fab = document.getElementById("cartFab");
  fab.style.transform = "scale(1.08)";
  setTimeout(()=> fab.style.transform = "scale(1)", 150);
}

function removeFromCart(id){
  cart = cart.filter(i => i.id !== id);
  updateBadge();
  renderSheet();
}

function updateBadge(){
  document.getElementById("cartBadge").textContent = cart.length;
}

function calcTotal(){
  const subtotal = cart.reduce((s,i)=> s+i.price, 0);
  const shipping = subtotal === 0 ? 0 : (subtotal >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_FEE);
  return { subtotal, shipping, total: subtotal + shipping };
}

/* ---------- sheet (cart / checkout / success) ---------- */
function openCart(){
  sheetMode = "cart";
  document.getElementById("overlay").classList.add("open");
  renderSheet();
}
function closeSheet(){
  document.getElementById("overlay").classList.remove("open");
}

function renderSheet(){
  const sheet = document.getElementById("sheet");
  if (sheetMode === "cart") {
    const { subtotal, shipping, total } = calcTotal();
    let itemsHtml = "";
    if (cart.length === 0) {
      itemsHtml = `<div class="empty-cart">Seu pedido está vazio.<br>Escolha os temperos no cardápio 🌿</div>`;
    } else {
      itemsHtml = cart.map(i => `
        <div class="cart-item">
          <div class="cart-item-info">
            <b>${i.prodLabel}</b>
            <div>${i.sizeLabel} · R$ ${i.price.toFixed(2)}</div>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${i.id})">remover</button>
        </div>
      `).join("");
    }
    sheet.innerHTML = `
      <div class="sheet-header">
        <p class="sheet-title">Meu pedido</p>
        <button class="close-btn" onclick="closeSheet()">✕</button>
      </div>
      ${itemsHtml}
      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2)}</span></div>
        <div class="totals-row"><span>Entrega</span><span>${shipping === 0 ? "Grátis" : "R$ " + shipping.toFixed(2)}</span></div>
        <div class="totals-row total"><span>Total</span><span>R$ ${total.toFixed(2)}</span></div>
        ${subtotal > 0 && subtotal < FREE_SHIPPING_THRESHOLD ? `<div class="shipping-note">Faltam R$ ${(FREE_SHIPPING_THRESHOLD - subtotal).toFixed(2)} para o frete grátis!</div>` : ""}
      </div>
      <button class="checkout-btn" ${cart.length===0 ? "disabled":""} onclick="goToCheckout()">Finalizar pedido</button>
    `;
  } else if (sheetMode === "checkout") {
    const { subtotal, shipping, total } = calcTotal();
    sheet.innerHTML = `
      <div class="sheet-header">
        <p class="sheet-title">Finalizar pedido</p>
        <button class="close-btn" onclick="closeSheet()">✕</button>
      </div>
      <label class="field-label">Seu nome</label>
      <input type="text" id="customerName" placeholder="Como podemos te chamar?">
      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2)}</span></div>
        <div class="totals-row"><span>Entrega</span><span>${shipping === 0 ? "Grátis" : "R$ " + shipping.toFixed(2)}</span></div>
        <div class="totals-row total"><span>Total</span><span>R$ ${total.toFixed(2)}</span></div>
      </div>
      <button class="checkout-btn" onclick="confirmOrder()">Confirmar e ver chave Pix</button>
    `;
  } else if (sheetMode === "success") {
    const { total } = calcTotal();
    sheet.innerHTML = `
      <div class="sheet-header">
        <p class="sheet-title">Pedido enviado! 🎉</p>
        <button class="close-btn" onclick="closeSheet()">✕</button>
      </div>
      <div class="success-icon">✅</div>
      <p style="text-align:center; font-size:14px; color:var(--brown-soft);">
        Seu pedido foi registrado. Agora é só pagar via Pix e enviar o comprovante.
      </p>
      <div class="pix-box">
        <div>Chave Pix</div>
        <div class="pix-key">${PIX_KEY}</div>
        <div style="font-size:14px; margin-bottom:10px;">Valor: R$ ${total.toFixed(2)}</div>
        <button class="copy-btn" onclick="copyPix()">Copiar chave</button>
      </div>
    `;
  }
}

function goToCheckout(){
  sheetMode = "checkout";
  renderSheet();
}

function confirmOrder(){
  const nameInput = document.getElementById("customerName");
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.style.border = "1.5px solid #b33";
    nameInput.placeholder = "Por favor, digite seu nome";
    return;
  }
  const { subtotal, shipping, total } = calcTotal();
  const order = {
    customer: name,
    items: cart.map(i => ({ lineKey: i.lineKey, prodKey: i.prodKey, prodLabel: i.prodLabel, sizeKey: i.sizeKey, sizeLabel: i.sizeLabel, price: i.price })),
    subtotal, shipping, total,
    status: "aguardando_pagamento",
    createdAt: Date.now(),
    source: "app",
  };
  saveOrder(order);
  sheetMode = "success";
  renderSheet();
  cart = [];
  updateBadge();
}

function copyPix(){
  navigator.clipboard.writeText(PIX_KEY).then(()=>{
    const btn = document.querySelector(".copy-btn");
    if (btn) { btn.textContent = "Copiado!"; setTimeout(()=> btn.textContent = "Copiar chave", 1500); }
  });
}

/* ---------- Firebase (com fallback localStorage) ---------- */
let dbReady = false;
try {
  if (typeof firebaseConfig !== "undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey !== "COLE_AQUI") {
    firebase.initializeApp(firebaseConfig);
    dbReady = true;
  }
} catch(e){ console.warn("Firebase não configurado ainda:", e); }

function saveOrder(order){
  if (dbReady) {
    firebase.database().ref("pedidos").push(order);
  } else {
    // fallback local, útil pra testar antes de configurar o Firebase
    const key = "caseirinho_pedidos_local";
    const list = JSON.parse(localStorage.getItem(key) || "[]");
    list.push(order);
    localStorage.setItem(key, JSON.stringify(list));
    console.info("Firebase não configurado — pedido salvo localmente (veja firebase-config.js)");
  }
}

renderMenu();
</script>
</body>
</html>

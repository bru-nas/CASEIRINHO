    min-height:100vh;
  }
  body::before{
    content:"";
    position: fixed;
    inset:0;
    background: rgba(245,238,224,0.90);
    z-index:-1;
  }
  header{ text-align:center; padding:20px 16px 6px; }
  .logo-img{ width:120px; max-width:40vw; height:auto; border-radius:50%; filter: drop-shadow(0 4px 10px rgba(59,42,30,0.15)); }
  .logo-sub{ letter-spacing:3px; font-size:11px; text-transform:uppercase; color:var(--brown-soft); margin-top:2px;}

  .tabs{
    display:flex; overflow-x:auto; gap:6px; padding: 12px 12px 0; max-width:1000px; margin:0 auto;
  }
  .tab-btn{
    background: var(--white); border:1px solid rgba(59,42,30,0.1); border-bottom:none;
    padding:10px 16px; border-radius:12px 12px 0 0; font-size:13px; font-weight:600;
    color:var(--brown-soft); cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{ background: var(--terracotta); color:white; }

  main{ max-width:1000px; margin:0 auto; padding: 0 12px 60px; }
  .panel{ background:var(--white); border-radius: 0 14px 14px 14px; padding:20px; box-shadow:var(--shadow); display:none;}
  .panel.active{ display:block; }

  h2{ font-family:'Caveat',cursive; font-size:28px; color:var(--terracotta-dark); margin:0 0 4px;}
  .subtitle{ font-size:12.5px; color:var(--brown-soft); margin-bottom:16px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:18px;}
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid rgba(59,42,30,0.08);}
  th{ color:var(--brown-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px;}
  tr:hover td{ background: rgba(193,98,43,0.04); }

  .card{ background: var(--cream-2); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card b{ font-size:14px; }
  .badge{ display:inline-block; background: var(--olive); color:white; font-size:10.5px; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .badge.platform{ background: var(--gold); color: var(--brown); }
  .badge.app{ background: var(--terracotta); }

  input, select{
    padding:8px 10px; border-radius:8px; border:1px solid rgba(59,42,30,0.2); font-family:'Poppins',sans-serif;
    font-size:13px; width:100%;
  }
  label{ font-size:12px; font-weight:600; color:var(--brown-soft); display:block; margin-bottom:3px; margin-top:10px;}
  .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;}
  .btn{
    background: var(--olive); color:white; border:none; border-radius:9px; padding:10px 16px;
    font-weight:600; font-size:13px; cursor:pointer; margin-top:12px;
  }
  .btn.secondary{ background: var(--terracotta); }
  .btn.danger{ background: var(--red); }
  .btn.small{ padding:5px 10px; font-size:11.5px; margin-top:0; }

  .stat-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .stat-box{
    flex:1; min-width:140px; background: var(--cream-2); border-radius:12px; padding:14px;
  }
  .stat-box .label{ font-size:11px; text-transform:uppercase; color:var(--brown-soft); letter-spacing:0.5px;}
  .stat-box .value{ font-size:22px; font-weight:700; margin-top:4px;}
  .stat-box.positive .value{ color: var(--olive); }
  .stat-box.negative .value{ color: var(--red); }

  .empty{ text-align:center; color: var(--brown-soft); font-size:13px; padding: 20px 0;}
  .batch-box{ border: 1.5px dashed var(--terracotta); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .batch-box .title{ font-weight:700; color:var(--terracotta-dark); font-size:14px; margin-bottom:6px;}
  .chain-step{ font-size:12.5px; color:var(--brown-soft); margin: 2px 0; padding-left: 10px; }
  .config-note{ background:#FFF6E5; border:1px solid #E8D9A8; border-radius:10px; padding:10px 12px; font-size:12px; color:#7A5E1E; margin-bottom:14px;}
</style>

<script>
/* ============ Firebase / storage layer ============ */
let dbReady = false;
try {
  if (typeof firebaseConfig !== "undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey !== "COLE_AQUI") {
    firebase.initializeApp(firebaseConfig);
    dbReady = true;
  }
} catch(e){ console.warn("Firebase não configurado:", e); }

function localGet(key){ return JSON.parse(localStorage.getItem(key) || "[]"); }
function localSet(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

// unified store: appOrders (from index.html), manualOrders, insumoPurchases, repasses, despesas
let STATE = {
  appOrders: [],       // pedidos do app (firebase pedidos node ou local fallback)
  manualOrders: [],    // pedidos por fora / plataformas
  insumoPurchases: [], // {date, insumo, qty, cost}
  repasses: [],        // {date, platform, month, value}
  despesas: [],        // {date, desc, value}
};

async function loadAll(){
  if (dbReady) {
    const snap = await firebase.database().ref("pedidos").once("value");
    const val = snap.val() || {};
    STATE.appOrders = Object.values(val);

    const m = await firebase.database().ref("pedidos_manuais").once("value");
    STATE.manualOrders = Object.values(m.val() || {});

    const ip = await firebase.database().ref("compras_insumos").once("value");
    STATE.insumoPurchases = Object.values(ip.val() || {});

    const rp = await firebase.database().ref("repasses").once("value");
    STATE.repasses = Object.values(rp.val() || {});

    const de = await firebase.database().ref("despesas").once("value");
    STATE.despesas = Object.values(de.val() || {});
  } else {
    STATE.appOrders = localGet("caseirinho_pedidos_local");
    STATE.manualOrders = localGet("caseirinho_pedidos_manuais");
    STATE.insumoPurchases = localGet("caseirinho_compras_insumos");
    STATE.repasses = localGet("caseirinho_repasses");
    STATE.despesas = localGet("caseirinho_despesas");
  }
}

async function pushRecord(node, record){
  if (dbReady) {
    await firebase.database().ref(node).push(record);
  } else {
    const map = { pedidos_manuais:"caseirinho_pedidos_manuais", compras_insumos:"caseirinho_compras_insumos", repasses:"caseirinho_repasses", despesas:"caseirinho_despesas" };
    const key = map[node];
    const list = localGet(key);
    list.push(record);
    localSet(key, list);
  }
}

/* ============ Tabs ============ */
const TABS = [
  { key:"pedidos", label:"Pedidos" },
  { key:"compras", label:"Lista de Compras" },
  { key:"ficha", label:"Ficha Técnica" },
  { key:"producao", label:"Produção" },
  { key:"plataformas", label:"Fora do App" },
  { key:"caixa", label:"Caixa" },
];
let activeTab = "pedidos";

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(t => `<button class="tab-btn ${t.key===activeTab?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`).join("");
}
function setTab(key){
  activeTab = key;
  renderTabs();
  renderMain();
}

function renderMain(){
  const main = document.getElementById("main");
  main.innerHTML = `<div class="panel active" id="panel"></div>`;
  const panel = document.getElementById("panel");
  if (activeTab === "pedidos") renderPedidos(panel);
  else if (activeTab === "compras") renderCompras(panel);
  else if (activeTab === "ficha") renderFicha(panel);
  else if (activeTab === "producao") renderProducao(panel);
  else if (activeTab === "plataformas") renderPlataformas(panel);
  else if (activeTab === "caixa") renderCaixa(panel);
}

/* ============ helper: get all order items (app + manual) ============ */
function allOrderItems(){
  // returns [{customer, prodKey, prodLabel, lineKey, sizeKey, sizeLabel, price, source, platform}]
  const items = [];
  STATE.appOrders.forEach(o => {
    (o.items||[]).forEach(it => items.push({ customer:o.customer, ...it, source:"app", platform:null }));
  });
  STATE.manualOrders.forEach(o => {
    items.push({ customer:o.customer, prodKey:o.prodKey, prodLabel:o.prodLabel, lineKey:o.lineKey, sizeKey:o.sizeKey, sizeLabel:o.sizeLabel, price:o.price, source:"manual", platform:o.platform });
  });
  return items;
}

/* ============ TAB: Pedidos (separação por pessoa) ============ */
function renderPedidos(panel){
  const items = allOrderItems();
  const paymentByCustomer = {};
  STATE.appOrders.forEach(o => { paymentByCustomer[o.customer] = o.paymentMethod; });
  const byCustomer = {};
  items.forEach(it => {
    const key = it.customer || "Sem nome";
    if (!byCustomer[key]) byCustomer[key] = [];
    byCustomer[key].push(it);
  });
  let html = `<h2>Pedidos por pessoa</h2><div class="subtitle">Separação de tudo que cada cliente pediu — app, fora do app e plataformas.</div>`;
  const names = Object.keys(byCustomer);
  if (names.length === 0) {
    html += `<div class="empty">Nenhum pedido registrado ainda.</div>`;
  } else {
    names.forEach(name => {
      const list = byCustomer[name];
      const total = list.reduce((s,i)=> s+(i.price||0), 0);
      const pm = paymentByCustomer[name];
      const pmBadge = pm === "pix" ? '<span class="badge" style="background:var(--gold); color:var(--brown);">Pix</span>' : pm === "card" ? '<span class="badge" style="background:var(--brown);">Cartão na entrega</span>' : "";
      html += `<div class="card">
        <b>${name}</b> ${list[0].source === "app" ? '<span class="badge app">App</span>' : ''} ${pmBadge}
        <table style="margin-top:8px;">
          <tr><th>Produto</th><th>Tamanho</th><th>Origem</th><th>Preço</th></tr>
          ${list.map(i => `<tr>
            <td>${i.prodLabel}</td><td>${i.sizeLabel}</td>
            <td>${i.source === "app" ? "App" : (i.platform || "Por fora")}</td>
            <td>R$ ${(i.price||0).toFixed(2)}</td>
          </tr>`).join("")}
        </table>
        <div style="text-align:right; font-weight:700;">Total: R$ ${total.toFixed(2)}</div>
      </div>`;
    });
  }
  panel.innerHTML = html;
}

/* ============ Recipe / insumo calc ============ */
function computeInsumoNeeds(items){
  const recipe = getRecipe();
  const needs = {}; // insumo -> grams/unidades
  const potes = { "300":0, "500":0, "1000":0 };
  let moedorCount = 0;

  function add(insumo, qty){
    if (!qty) return;
    needs[insumo] = (needs[insumo]||0) + qty;
  }

  items.forEach(it => {
    const { lineKey, prodKey, sizeKey } = it;
    if (lineKey === "dia_a_dia") {
      const base = recipe.dia_a_dia_base;
      add("alho", base.alho[sizeKey]);
      add("sal", base.sal[sizeKey]);
      add("cebola", base.cebola[sizeKey]);
      add("pimenta_cheiro", base.pimenta_cheiro[sizeKey]);
      const isCheiroVerdeFamily = prodKey.startsWith("cheiro_verde") || prodKey === "toque_caseiro";
      if (isCheiroVerdeFamily) add("cheiro_verde_folha", recipe.cheiro_verde_extra.cheiro_verde_folha[sizeKey]);
      if (prodKey === "tradicional_picante" || prodKey === "cheiro_verde_picante") {
        add("pimenta_malagueta", recipe.transform.pimenta_malagueta[sizeKey]);
      }
      if (prodKey === "toque_baiano") {
        add("pimenta_malagueta", recipe.transform.pimenta_malagueta[sizeKey]);
        add("cominho", recipe.transform.cominho[sizeKey]);
        add("pimenta_do_reino", recipe.transform.pimenta_do_reino[sizeKey]);
        add("salsa", recipe.transform.salsa[sizeKey]);
        add("azeite_dende", recipe.transform.azeite_dende[sizeKey]);
      }
      if (prodKey === "toque_caipira") {
        add("acafrao", recipe.transform.acafrao[sizeKey]);
        add("mix_pimentas_aromat", recipe.transform.mix_pimentas_aromat[sizeKey]);
      }
      if (prodKey === "toque_caseiro") {
        add("pimenta_malagueta", recipe.transform.pimenta_malagueta[sizeKey]);
        add("fumaca_po", recipe.transform.fumaca_po[sizeKey]);
      }
      potes[sizeKey] = (potes[sizeKey]||0) + 1;
    } else if (lineKey === "pure") {
      add("alho", recipe.pure.alho[sizeKey]);
      potes[sizeKey] = (potes[sizeKey]||0) + 1;
    } else if (lineKey === "saladete") {
      const r = recipe.saladete;
      Object.keys(r).forEach(insumo => add(insumo, r[insumo][sizeKey]));
      if (sizeKey === "com_moedor") moedorCount++;
    } else if (lineKey === "churrasco") {
      const r = recipe.churrasco[prodKey];
      if (r) Object.keys(r).forEach(insumo => add(insumo, r[insumo]));
    }
  });

  return { needs, potes, moedorCount };
}

/* ============ TAB: Lista de Compras ============ */
function renderCompras(panel){
  const items = allOrderItems();
  const { needs, potes, moedorCount } = computeInsumoNeeds(items);
  let html = `<h2>Lista de compras</h2><div class="subtitle">Total de insumos necessários pra atender todos os pedidos registrados (app + fora + plataformas).</div>`;

  const insumoKeys = Object.keys(needs);
  if (insumoKeys.length === 0) {
    html += `<div class="empty">Nenhum pedido pra calcular ainda.</div>`;
  } else {
    html += `<table>
      <tr><th>Insumo</th><th>Quantidade necessária</th></tr>
      ${insumoKeys.map(k => `<tr><td>${INSUMO_LABELS[k]||k}</td><td>${needs[k].toFixed(2)} ${k.includes("limao")?"un":"g"}</td></tr>`).join("")}
    </table>`;
  }

  html += `<h2 style="margin-top:20px;">Embalagens e potes</h2>`;
  html += `<table>
    <tr><th>Item</th><th>Quantidade</th></tr>
    <tr><td>Pote de 300g</td><td>${potes["300"]||0}</td></tr>
    <tr><td>Pote de 500g</td><td>${potes["500"]||0}</td></tr>
    <tr><td>Pote de 1kg</td><td>${potes["1000"]||0}</td></tr>
    <tr><td>Moedor (Saladete com moedor)</td><td>${moedorCount} — custo estimado R$ ${(moedorCount*MOEDOR_COST).toFixed(2)}</td></tr>

function saveFicha(){
  const recipe = getRecipe();
  Object.keys(recipe.dia_a_dia_base).forEach(k => {
    ["300","500","1000"].forEach(sz => {
      recipe.dia_a_dia_base[k][sz] = parseFloat(document.getElementById(`f_base_${k}_${sz}`).value) || 0;
    });
  });
  ["300","500","1000"].forEach(sz => {
    recipe.cheiro_verde_extra.cheiro_verde_folha[sz] = parseFloat(document.getElementById(`f_cv_${sz}`).value) || 0;
  });
  Object.keys(recipe.transform).forEach(k => {
    ["300","500","1000"].forEach(sz => {
      recipe.transform[k][sz] = parseFloat(document.getElementById(`f_tr_${k}_${sz}`).value) || 0;
    });
  });
  recipe.pure.alho["300"] = parseFloat(document.getElementById("f_pure_300").value) || 0;
  recipe.pure.alho["500"] = parseFloat(document.getElementById("f_pure_500").value) || 0;
  Object.keys(recipe.saladete).forEach(k => {
    const v = parseFloat(document.getElementById(`f_sal_${k}`).value) || 0;
    recipe.saladete[k].com_moedor = v;
    recipe.saladete[k].sem_refil = v;
  });
  Object.keys(recipe.churrasco).forEach(prodKey => {
    Object.keys(recipe.churrasco[prodKey]).forEach(k => {
      recipe.churrasco[prodKey][k] = parseFloat(document.getElementById(`f_bbq_${prodKey}_${k}`).value) || 0;
    });
  });
  recipe.embalagens.moedor = parseFloat(document.getElementById("f_moedor").value) || 0;
  saveRecipe(recipe);
  alert("Ficha técnica salva!");
}

/* ============ TAB: Produção ============ */
function fmtQty(v, insumo){
  const unit = insumo && insumo.includes("limao") ? "un" : "g";
  return `${v.toFixed(v < 10 ? 2 : 1)}${unit}`;
}

function renderProducao(panel){
  const recipe = getRecipe();
  const items = allOrderItems().filter(i => i.lineKey === "dia_a_dia" || i.lineKey === "pure");
  const counts = {}; // "prodKey|sizeKey" -> qty
  items.forEach(i => {
    const key = `${i.prodKey}|${i.sizeKey}`;
    counts[key] = (counts[key]||0) + 1;
  });

  let html = `<h2>Produção</h2><div class="subtitle">Quantidade exata de insumo pra bater e o que adicionar em cada etapa. Capacidade por lote: 3 potes de 300g, ou 2 de 500g, ou 1 de 1kg.</div>`;

  if (Object.keys(counts).length === 0) {
    html += `<div class="empty">Nenhum pedido de Dia a Dia ou Pure pra produzir ainda.</div>`;
    panel.innerHTML = html;
    return;
  }

  const u = (key, sizeKey) => counts[`${key}|${sizeKey}`] || 0;

  ["300","500","1000"].forEach(sizeKey => {
    const sizeItems = Object.entries(counts).filter(([k]) => k.endsWith("|"+sizeKey));
    if (sizeItems.length === 0) return;
    const totalUnits = sizeItems.reduce((s,[,q])=> s+q, 0);
    const capacity = BATCH_CAPACITY[sizeKey];
    const numBatches = Math.ceil(totalUnits / capacity);
    const sizeLbl = sizeKey === "1000" ? "1kg" : sizeKey + "g";

    html += `<div class="batch-box"><div class="title">Tamanho ${sizeLbl} — ${totalUnits} unidade(s), ~${numBatches} lote(s) (capacidade ${capacity}/lote)</div>`;

    /* ---- Cadeia Tradicional: tradicional, tradicional_picante, toque_baiano, toque_caipira ---- */
    const nTrad = u("tradicional", sizeKey);
    const nTradPic = u("tradicional_picante", sizeKey);
    const nBaiano = u("toque_baiano", sizeKey);
    const nCaipira = u("toque_caipira", sizeKey);
    const totalTradFamily = nTrad + nTradPic + nBaiano + nCaipira;

    if (totalTradFamily > 0) {
      const base = recipe.dia_a_dia_base;
      const totalAlho = base.alho[sizeKey] * totalTradFamily;
      const totalSal = base.sal[sizeKey] * totalTradFamily;
      const totalCebola = base.cebola[sizeKey] * totalTradFamily;
      const totalPimCheiro = base.pimenta_cheiro[sizeKey] * totalTradFamily;

      html += `<div class="chain-step" style="margin-top:10px;"><b>🧄 Base Tradicional (${totalTradFamily} unidade(s) no total)</b></div>`;
      html += `<div class="chain-step">1. Bata junto: ${fmtQty(totalAlho)} de Alho, ${fmtQty(totalSal)} de Sal, ${fmtQty(totalCebola)} de Cebola, ${fmtQty(totalPimCheiro)} de Pimenta de Cheiro.</div>`;

      let step = 2;
      if (nTrad > 0) {
        html += `<div class="chain-step">${step}. Retire ${nTrad} unidade(s) — já está pronto como <b>Tradicional</b>, embale.</div>`; step++;
      }
      if (nCaipira > 0) {
        const acaf = recipe.transform.acafrao[sizeKey] * nCaipira;
        const mix = recipe.transform.mix_pimentas_aromat[sizeKey] * nCaipira;
        html += `<div class="chain-step">${step}. Retire ${nCaipira} unidade(s), adicione ${fmtQty(acaf)} de Açafrão e ${fmtQty(mix)} de Mix de Pimentas Aromáticas — vira <b>Toque Caipira</b>, embale.</div>`; step++;
      }
      if (nTradPic + nBaiano > 0) {
        const nPic = nTradPic + nBaiano;
        const malagueta = recipe.transform.pimenta_malagueta[sizeKey] * nPic;
        html += `<div class="chain-step">${step}. No restante (${nPic} unidade(s)), adicione ${fmtQty(malagueta)} de Pimenta Malagueta — vira massa de <b>Tradicional Picante</b>.</div>`; step++;
        if (nTradPic > 0) {
          html += `<div class="chain-step">${step}. Retire ${nTradPic} unidade(s) — já está pronto como <b>Tradicional Picante</b>, embale.</div>`; step++;
        }
        if (nBaiano > 0) {
          const cominho = recipe.transform.cominho[sizeKey] * nBaiano;
          const reino = recipe.transform.pimenta_do_reino[sizeKey] * nBaiano;
          const salsa = recipe.transform.salsa[sizeKey] * nBaiano;
          const dende = recipe.transform.azeite_dende[sizeKey] * nBaiano;
          html += `<div class="chain-step">${step}. No restante (${nBaiano} unidade(s)), adicione ${fmtQty(cominho)} de Cominho, ${fmtQty(reino)} de Pimenta do Reino, ${fmtQty(salsa)} de Salsa e ${fmtQty(dende)} de Azeite de Dendê — vira <b>Toque Baiano</b>, embale.</div>`; step++;
        }
      }
    }

    /* ---- Cadeia Cheiro Verde: cheiro_verde, cheiro_verde_picante, toque_caseiro ---- */
    const nCV = u("cheiro_verde", sizeKey);
    const nCVPic = u("cheiro_verde_picante", sizeKey);
    const nCaseiro = u("toque_caseiro", sizeKey);
    const totalCVFamily = nCV + nCVPic + nCaseiro;

    if (totalCVFamily > 0) {
      const base = recipe.dia_a_dia_base;
      const folha = recipe.cheiro_verde_extra.cheiro_verde_folha[sizeKey] * totalCVFamily;
      const totalAlho = base.alho[sizeKey] * totalCVFamily;
      const totalSal = base.sal[sizeKey] * totalCVFamily;
      const totalCebola = base.cebola[sizeKey] * totalCVFamily;
      const totalPimCheiro = base.pimenta_cheiro[sizeKey] * totalCVFamily;

      html += `<div class="chain-step" style="margin-top:10px;"><b>🌿 Base Cheiro Verde (${totalCVFamily} unidade(s) no total)</b></div>`;
      html += `<div class="chain-step">1. Bata junto: ${fmtQty(totalAlho)} de Alho, ${fmtQty(totalSal)} de Sal, ${fmtQty(totalCebola)} de Cebola, ${fmtQty(totalPimCheiro)} de Pimenta de Cheiro, ${fmtQty(folha)} de Cheiro Verde.</div>`;

      let step = 2;
      if (nCV > 0) {
        html += `<div class="chain-step">${step}. Retire ${nCV} unidade(s) — já está pronto como <b>Cheiro Verde</b>, embale.</div>`; step++;
      }
      if (nCVPic + nCaseiro > 0) {
        const nPic = nCVPic + nCaseiro;
        const malagueta = recipe.transform.pimenta_malagueta[sizeKey] * nPic;
        html += `<div class="chain-step">${step}. No restante (${nPic} unidade(s)), adicione ${fmtQty(malagueta)} de Pimenta Malagueta — vira massa de <b>Cheiro Verde Picante</b>.</div>`; step++;
        if (nCVPic > 0) {
          html += `<div class="chain-step">${step}. Retire ${nCVPic} unidade(s) — já está pronto como <b>Cheiro Verde Picante</b>, embale.</div>`; step++;
        }
        if (nCaseiro > 0) {
          const fumaca = recipe.transform.fumaca_po[sizeKey] * nCaseiro;
          html += `<div class="chain-step">${step}. No restante (${nCaseiro} unidade(s)), adicione ${fmtQty(fumaca)} de Fumaça em Pó — vira <b>Toque Caseiro</b>, embale.</div>`; step++;
        }
      }
    }

    /* ---- Pure ---- */
    const nPure = u("pure", sizeKey);
    if (nPure > 0) {
      const alhoPure = recipe.pure.alho[sizeKey] * nPure;
      html += `<div class="chain-step" style="margin-top:10px;"><b>🫙 Pure (${nPure} unidade(s))</b></div>`;
      html += `<div class="chain-step">Bata ${fmtQty(alhoPure)} de Alho com azeite. Pode bater junto num liquidificador só se sobrar espaço em algum lote acima — só não misture na mesma massa dos outros temperos.</div>`;
    }

    html += `</div>`;
  });

  panel.innerHTML = html;
}

function updateManualProductOptions(){
  const lineKey = document.getElementById("m_line").value;
  const line = MENU[lineKey];
  document.getElementById("m_product").innerHTML = line.products.map(p => `<option value="${p.key}">${p.label}</option>`).join("");
  document.getElementById("m_size").innerHTML = line.sizes.map(s => `<option value="${s.key}" data-price="${s.price}">${s.label} — R$ ${s.price.toFixed(2)}</option>`).join("");
  document.getElementById("m_size").onchange = () => {
    const opt = document.getElementById("m_size").selectedOptions[0];
    document.getElementById("m_price").value = opt.dataset.price;
  };
  document.getElementById("m_size").onchange();
}

async function addManualOrder(){
  const lineKey = document.getElementById("m_line").value;
  const prodKey = document.getElementById("m_product").value;
  const prod = MENU[lineKey].products.find(p=>p.key===prodKey);
  const sizeOpt = document.getElementById("m_size").selectedOptions[0];
  const sizeKey = sizeOpt.value;
  const sizeLabel = sizeOpt.textContent.split(" — ")[0];
  const customer = document.getElementById("m_customer").value.trim() || "Sem nome";
  const platform = document.getElementById("m_platform").value;
  const price = parseFloat(document.getElementById("m_price").value) || 0;

  const record = { customer, lineKey, prodKey, prodLabel: prod.label, sizeKey, sizeLabel, platform, price, createdAt: Date.now() };
  await pushRecord("pedidos_manuais", record);
  await loadAll();
  renderMain();
}

/* ============ TAB: Caixa ============ */
function monthKey(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthLabel(key){
  const [y,m] = key.split("-");
  const names = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${names[parseInt(m)-1]}/${y}`;
}

function renderCaixa(panel){
  let html = `<h2>Fechamento de caixa</h2><div class="subtitle">Entradas (pedidos do app + fora do app + repasses) menos saídas (insumos + despesas).</div>`;

  // Registrar compra de insumo
  html += `<b>Registrar compra de insumo</b>
  <div class="form-grid">
    <div><label>Insumo</label><input type="text" id="c_insumo" placeholder="Ex: Alho"></div>
    <div><label>Quantidade</label><input type="number" step="0.1" id="c_qty" placeholder="Ex: 1000 (g)"></div>
    <div><label>Valor pago (R$)</label><input type="number" step="0.01" id="c_cost" placeholder="Ex: 25.00"></div>
    <div><label>Data</label><input type="date" id="c_date" value="${new Date().toISOString().slice(0,10)}"></div>
  </div>
  <button class="btn" onclick="addInsumoPurchase()">Registrar compra</button>`;

  // Registrar repasse de plataforma
  html += `<b style="display:block; margin-top:22px;">Registrar repasse de plataforma (fim do mês)</b>
  <div class="form-grid">
    <div><label>Plataforma</label><select id="r_platform">${PLATFORMS.slice(1).map(p=>`<option>${p}</option>`).join("")}</select></div>
    <div><label>Valor recebido (R$)</label><input type="number" step="0.01" id="r_value" placeholder="Ex: 350.00"></div>
    <div><label>Mês/ano</label><input type="month" id="r_month" value="${new Date().toISOString().slice(0,7)}"></div>
  </div>
  <button class="btn secondary" onclick="addRepasse()">Registrar repasse</button>`;

  // Registrar despesa
  html += `<b style="display:block; margin-top:22px;">Registrar outra despesa (gasolina, taxas etc)</b>
  <div class="form-grid">
    <div><label>Descrição</label><input type="text" id="d_desc" placeholder="Ex: Gasolina"></div>
    <div><label>Valor (R$)</label><input type="number" step="0.01" id="d_value" placeholder="Ex: 50.00"></div>
    <div><label>Data</label><input type="date" id="d_date" value="${new Date().toISOString().slice(0,10)}"></div>
  </div>
  <button class="btn danger" onclick="addDespesa()">Registrar despesa</button>`;

  // Fechamento por mês
  html += `<h2 style="margin-top:26px;">Fechamento por mês</h2>`;
  const months = new Set();
  STATE.appOrders.forEach(o => months.add(monthKey(o.createdAt)));
  STATE.manualOrders.forEach(o => months.add(monthKey(o.createdAt)));
  STATE.insumoPurchases.forEach(o => months.add(monthKey(new Date(o.date).getTime())));
  STATE.despesas.forEach(o => months.add(monthKey(new Date(o.date).getTime())));
  STATE.repasses.forEach(o => months.add(o.month));

  if (months.size === 0) {
    html += `<div class="empty">Sem movimentações registradas ainda.</div>`;
  } else {
    const sortedMonths = [...months].sort();
    sortedMonths.forEach(mk => {
      const appOrdersMonth = STATE.appOrders.filter(o=>monthKey(o.createdAt)===mk);
      const productEntradas = appOrdersMonth.reduce((s,o)=>s+(o.subtotal||0),0);
      const shippingEntradas = appOrdersMonth.reduce((s,o)=>s+(o.shipping||0),0);
      const manualEntradas = STATE.manualOrders.filter(o=>monthKey(o.createdAt)===mk).reduce((s,o)=>s+(o.price||0),0);
      const repasseEntradas = STATE.repasses.filter(r=>r.month===mk).reduce((s,r)=>s+(r.value||0),0);
      const insumoSaidas = STATE.insumoPurchases.filter(o=>monthKey(new Date(o.date).getTime())===mk).reduce((s,o)=>s+(o.cost||0),0);
      const despesasMonth = STATE.despesas.filter(o=>monthKey(new Date(o.date).getTime())===mk);
      const gasolinaSaidas = despesasMonth.filter(d => (d.desc||"").toLowerCase().includes("gasolina")).reduce((s,o)=>s+(o.value||0),0);
      const outrasDespesas = despesasMonth.reduce((s,o)=>s+(o.value||0),0) - gasolinaSaidas;
      const entradas = productEntradas + shippingEntradas + manualEntradas + repasseEntradas;
      const saidas = insumoSaidas + gasolinaSaidas + outrasDespesas;
      const caixa = entradas - saidas;

      html += `<div class="card"><b>${monthLabel(mk)}</b>
        <div class="stat-row" style="margin-top:8px;">
          <div class="stat-box positive"><div class="label">Entradas</div><div class="value">R$ ${entradas.toFixed(2)}</div></div>
          <div class="stat-box negative"><div class="label">Saídas</div><div class="value">R$ ${saidas.toFixed(2)}</div></div>
          <div class="stat-box ${caixa>=0?'positive':'negative'}"><div class="label">Caixa</div><div class="value">R$ ${caixa.toFixed(2)}</div></div>
        </div>
        <table style="margin-top:4px;">
          <tr><th>Detalhe</th><th>Valor</th></tr>
          <tr><td>Vendas (produtos)</td><td>R$ ${productEntradas.toFixed(2)}</td></tr>
          <tr><td>Taxa de entrega recebida</td><td style="color:var(--olive); font-weight:600;">+ R$ ${shippingEntradas.toFixed(2)}</td></tr>
          <tr><td>Pedidos por fora / plataformas</td><td>R$ ${manualEntradas.toFixed(2)}</td></tr>
          <tr><td>Repasses de plataforma</td><td>R$ ${repasseEntradas.toFixed(2)}</td></tr>
          <tr><td>Gasolina</td><td style="color:var(--red);">− R$ ${gasolinaSaidas.toFixed(2)}</td></tr>
          <tr><td>Insumos comprados</td><td style="color:var(--red);">− R$ ${insumoSaidas.toFixed(2)}</td></tr>
          <tr><td>Outras despesas</td><td style="color:var(--red);">− R$ ${outrasDespesas.toFixed(2)}</td></tr>
        </table>
        <div class="config-note" style="margin-top:0;">Taxa de entrega entra como receita e ajuda a cobrir a Gasolina — compare as duas linhas acima. Pedidos pagos no cartão na entrega já incluem a taxa da maquininha no valor cobrado do cliente, então não afetam seu caixa líquido.</div>
      </div>`;
    });
  }

  panel.innerHTML = html;
}

async function addInsumoPurchase(){
  const insumo = document.getElementById("c_insumo").value.trim();
  const qty = parseFloat(document.getElementById("c_qty").value) || 0;
  const cost = parseFloat(document.getElementById("c_cost").value) || 0;
  const date = document.getElementById("c_date").value;
  if (!insumo) return alert("Informe o insumo.");
  await pushRecord("compras_insumos", { insumo, qty, cost, date });
  await loadAll(); renderMain();
}
async function addRepasse(){
  const platform = document.getElementById("r_platform").value;
  const value = parseFloat(document.getElementById("r_value").value) || 0;
  const month = document.getElementById("r_month").value;
  await pushRecord("repasses", { platform, value, month });
  await loadAll(); renderMain();
}
async function addDespesa(){
  const desc = document.getElementById("d_desc").value.trim();
  const value = parseFloat(document.getElementById("d_value").value) || 0;
  const date = document.getElementById("d_date").value;
  if (!desc) return alert("Informe a descrição.");
  await pushRecord("despesas", { desc, value, date });
  await loadAll(); renderMain();
}

/* ============ init ============ */
(async function init(){
  renderTabs();
  document.getElementById("main").innerHTML = `<div class="panel active"><div class="empty">Carregando...</div></div>`;
  await loadAll();
  renderMain();
})();
</script>
